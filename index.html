<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="index.js" defer async type="module"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>weather</h1>
            <p>ermina alibegovic</p>
        </div>
        <form>
            <input id="city-input" type="text" placeholder="Enter city">
            <input type="submit" value="Get weather">
        </form>
        <div id="weather-data">
            <div class="icon">
                <img src="http://openweathermap.org/img/wn/01d.png" alt="weather icon">
            </div>
            <div class="temperature">22°C</div>
            <div class="details">
                <div class="feel">Feels like : 23°C</div>
                <div class="humidity">Humidity:40%</div>
                <div class="wind">Wind speed : 5m/s</div>
            </div>
        </div>
    </div>
</body>
</html>
